{% extends 'base.html' %}
<!-- This page was to make the necessary corrections for the LogoutViews since "GET" is no longer allowed for logging out users since there's no csrf token that's needed and its seen as a security flaw -->
<!-- but in reality it was to keep the framework "Pure" -->
{% block title %}
    <title>This is the About page!</title>
{% endblock title %}




{% block content %}
  <div class="container">
    <h1>{{ about_text }}</h1>
  </div>
<div>
  <!-- on a template where you want to add a logout button -->
<form method="POST" action="{% url 'logout' %}">
  {% csrf_token %}
  <button type="submit">logout</button>
</form>
  </form>
</div>
{% endblock content %}    <h1>{{ welcome_text }}</h1>
</div>
